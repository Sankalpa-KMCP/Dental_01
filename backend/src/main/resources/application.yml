server:
  port: 8080

spring:
  application:
    name: dental-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dental_management_dev}
    username: ${DB_USERNAME:dental_user}
    password: ${DB_PASSWORD:dental_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
